version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  # the menu bar app is its own Cargo workspace with its own lockfile, so it is listed beside the
  # root or its dependencies are never updated
  - package-ecosystem: cargo
    directories: ["/", "/app/src-tauri"]
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      cargo:
        patterns: ["*"]
