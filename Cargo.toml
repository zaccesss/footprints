[package]
name = "footprints"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "See and undo what AI agents do on your machine: a local ledger of file writes, shell commands and network calls with one-step undo"
license = "Apache-2.0"
repository = "https://github.com/zaccesss/footprints"
homepage = "https://isaacadjei.me"
readme = "README.md"
keywords = ["agents", "undo", "audit", "ledger", "mcp"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
exclude = [".github/"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
notify = "8.2.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
